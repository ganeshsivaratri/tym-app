<script>
/* ===== screen: today ===== */
(function(){
'use strict';
/* ============================================================
   TYM — Track Your Mind · today.js
   What this file does: the TODAY screen — greeting, My Day
   Top-3 focus banner, day progress ring, quick add, and
   today's + overdue task lists.
   Data comes from tasks.js (tasksForToday, dayStats).
   Card clicks (tick, edit, delete, pin) are handled in
   editor.js — this file only draws and quick-adds.
   ============================================================ */

/* The progress ring: an SVG circle that fills to pct%. */
function ringHTML(pct) {
  const r = 34, c = 2 * Math.PI * r;
  const off = c - (pct / 100) * c;
  return '<svg class="ring" width="84" height="84" viewBox="0 0 84 84">' +
    '<defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0%" stop-color="#f6b73c"/><stop offset="100%" stop-color="#f59e0b"/>' +
    '</linearGradient></defs>' +
    '<circle class="ring-bg" cx="42" cy="42" r="' + r + '" fill="none" stroke-width="8"/>' +
    '<circle class="ring-fg" cx="42" cy="42" r="' + r + '" fill="none" stroke-width="8" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/></svg>';
}

function render() {
  const now = new Date();
  const groups = tasksForToday(state, now);
  const stats = dayStats(state, now);
  const box = document.getElementById('screenContent');

  // Greeting line at the top of the screen.
  document.getElementById('greetingLine').textContent =
    greetingText(now) + ' · ' + now.toLocaleDateString(undefined,
      { weekday: 'long', day: 'numeric', month: 'long' });

  // The focus banner: Top-3 pins, or a hint to pin.
  const focusHTML = groups.focus.length
    ? groups.focus.map(t =>
        '<div class="fb-task">📌 ' + escapeHTML(t.title) + '</div>').join('')
    : '<div class="fb-task">Pin up to 3 tasks with 📍 to plan your day.</div>';

  let html =
    '<div class="focus-banner stagger"><h2>🎯 My Day — Top 3</h2>' + focusHTML + '</div>' +
    '<div class="stat-grid" style="margin-bottom:18px">' +
      '<div class="stat"><b>' + stats.doneToday + '</b><span>done today</span></div>' +
      '<div class="stat"><b>' + stats.streak + ' 🔥</b><span>day streak</span></div>' +
      '<div class="stat"><b>' + stats.openCount + '</b><span>open tasks</span></div>' +
    '</div>' +
    '<div class="card ring-wrap" style="margin-bottom:6px">' + ringHTML(stats.pctToday) +
      '<div><div class="ring-num">' + stats.pctToday + '% of today done</div>' +
      '<div style="color:var(--muted)">' + stats.doneDueToday + ' of ' +
        stats.dueTodayCount + ' tasks due today are complete</div></div>' +
    '</div>';

  // Overdue first — it needs attention — then today's list.
  if (groups.overdue.length) {
    html += '<div class="section-title">⚠️ Overdue</div><div class="stagger">' +
      groups.overdue.map(t => taskCardHTML(state, t)).join('') + '</div>';
  }
  html += '<div class="section-title">📅 Today</div>';
  if (groups.today.length) {
    html += '<div class="stagger">' + groups.today.map(t => taskCardHTML(state, t)).join('') + '</div>';
  } else if (!groups.focus.length && !groups.overdue.length) {
    html += '<div class="card empty"><div class="empty-art">🌅</div>' +
      '<p>Nothing due today. Add a task above, or pin a Top 3.</p></div>';
  } else {
    html += '<div class="card empty"><p>Nothing else due today. 🎉</p></div>';
  }
  box.innerHTML = html;

  // Day Complete ritual: the first moment today's plan hits
  // 100%, celebrate once and offer the Review screen.
  if (stats.dueTodayCount > 0 && stats.pctToday === 100 &&
      !state.dayDoneCelebrated[todayStr(now)]) {
    state.dayDoneCelebrated[todayStr(now)] = true;
    saveState(state);
    showDayComplete();
  }
}

/* The Day Complete overlay: a small full-screen moment. */
function showDayComplete() {
  if (document.getElementById('dayComplete')) return;
  const d = document.createElement('div');
  d.className = 'day-complete';
  d.id = 'dayComplete';
  d.innerHTML = '<div class="dc-emoji">🎉</div>' +
    '<div class="dc-title">Day Complete!</div>' +
    '<p>Everything due today is done. That is how streaks are built.</p>' +
    '<div class="alarm-actions">' +
    '<button class="btn btn-primary" id="dcReview">📊 See my Review</button>' +
    '<button class="btn" id="dcClose">Close</button></div>';
  document.body.appendChild(d);
  tymBuzz([150, 60, 150, 60, 300]);
  document.getElementById('dcClose').addEventListener('click', () => d.remove());
  document.getElementById('dcReview').addEventListener('click', () => { window.location.href = 'review.html'; });
}

/* Quick add: type naturally — "Pay fees tomorrow 5pm !high
   #college" — parse.js pulls out date, time, priority, tags.
   No date given = due today. Details via the editor (✏️). */
function quickAdd() {
  const input = document.getElementById('quickInput');
  const raw = input.value.trim();
  if (!raw) return;
  const p = parseQuickAdd(raw, new Date());
  if (!p.title) { showToast('Type the task name too'); return; }

   ============================================================ */

let allQuery = '';       // current search text

let allSort = 'due';     // current sort mode

function render() {

    tasks.map(t => taskCardHTML(state, t)).join('') + '</div>';

  // Drag to reorder — only meaningful in "My order" sort.
  if (allSort === 'manual' && !allQuery) {
    box.querySelectorAll('.task').forEach(card => {
      card.draggable = true;

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        // Save the new order from the card positions on screen.
        const ids = Array.from(box.querySelectorAll('.task')).map(c => c.dataset.card);
        ids.forEach((id, i) => { const t = findTask(state, id); if (t) t.order = i + 1; });
        saveState(state);

      card.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = box.querySelector('.dragging');
        if (!dragging || dragging === card) return;
        const rect = card.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height / 2;

<script>
/* ===== screen: matrix ===== */
(function(){
'use strict';
/* ============================================================
   TYM — Track Your Mind · matrix.js
   What this file does: the MATRIX screen — Eisenhower's
   urgent × important grid.
   Urgent = overdue, or due within 2 days.
   Important = high priority.
   Drag a card to another box to change it: moving into
   "important" sets high priority; into "urgent" pulls the
   due date to today; out of "urgent" pushes it a week out.
   ============================================================ */

function isUrgent(t, now) {
  if (!t.due) return false;
  return daysBetween(todayStr(now), t.due) <= 2;
}

const QUADS = [
  { id: 'do', name: 'Do first', icon: '🔥', urgent: true, important: true },
  { id: 'plan', name: 'Plan', icon: '🗓️', urgent: false, important: true },
  { id: 'quick', name: 'Quick / delegate', icon: '⚡', urgent: true, important: false },
  { id: 'later', name: 'Later', icon: '🧊', urgent: false, important: false }
];

function quadOf(t, now) {
  const u = isUrgent(t, now), i = t.priority === 'high';
  return QUADS.find(q => q.urgent === u && q.important === i).id;
}

function matrixCardHTML(t) {
  return '<div class="board-card" draggable="true" data-mcard="' + t.id + '">' +
    '<div class="board-card-title">' + escapeHTML(t.title) + '</div>' +
    '<div class="task-meta">' +
      (t.due ? '<span class="pill">' + dueLabel(t.due) + '</span>' : '<span class="pill">no date</span>') +
      '<button class="icon-btn" data-edit="' + t.id + '">✏️</button>' +
    '</div></div>';
}

function render() {
  const box = document.getElementById('screenContent');
  const now = new Date();
  const open = state.tasks.filter(t => t.status !== 'done');
  box.innerHTML =
    '<p style="color:var(--muted);margin-top:0">Drag a card to another box — its priority and due date change to match.</p>' +
    '<div class="matrix stagger">' + QUADS.map(q => {
      const tasks = open.filter(t => quadOf(t, now) === q.id);
      return '<div class="matrix-cell" data-quad="' + q.id + '">' +
        '<h3>' + q.icon + ' ' + q.name + ' <span class="badge">' + tasks.length + '</span></h3>' +
        (tasks.map(matrixCardHTML).join('') || '<p class="board-empty">—</p>') +
        '</div>';
    }).join('') + '</div>';

  box.querySelectorAll('[data-mcard]').forEach(card => {
    card.addEventListener('dragstart', e =>
      e.dataTransfer.setData('text/tym-task', card.dataset.mcard));
  });
  box.querySelectorAll('[data-quad]').forEach(cell => {
    cell.addEventListener('dragover', e => e.preventDefault());
    cell.addEventListener('drop', e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/tym-task');
      const t = findTask(state, id);
      if (!t) return;
      const q = QUADS.find(x => x.id === cell.dataset.quad);
      const today = todayStr();
      t.priority = q.important ? 'high' : (t.priority === 'high' ? 'med' : t.priority);
      if (q.urgent && (!t.due || t.due > addDaysStr(today, 2))) t.due = today;
      if (!q.urgent && t.due && t.due <= addDaysStr(today, 2)) t.due = addDaysStr(today, 7);
      saveState(state);
      render();
    });
  });
}

})();

  const old = placed.map(p => ({ id: p.id, time: findTask(state, p.id).time }));

function fmt(sec) {
  return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
}

function render() {
  const box = document.getElementById('screenContent');
  const open = state.tasks.filter(t => t.status !== 'done');
  const todayLog = state.focusLog.filter(s => s.date === todayStr());
  const minsToday = todayLog.reduce((a, s) => a + s.minutes, 0);

  box.innerHTML =
    '<div class="focus-wrap card">' +
      '<div class="focus-modes">' +
        '<button class="btn' + (fMode === 'work' ? ' btn-primary' : '') + '" id="fmWork">🍅 Work ' + fWorkMin + 'm</button>' +
        '<button class="btn' + (fMode === 'break' ? ' btn-primary' : '') + '" id="fmBreak">☕ Break ' + fBreakMin + 'm</button>' +
      '</div>' +
      '<div class="focus-clock" id="fClock">' + fmt(fLeft) + '</div>' +
      '<label style="color:var(--muted);font-size:13px;font-weight:700">Focusing on</label>' +

      '<div class="focus-actions">' +
        '<button class="btn btn-primary" id="fToggle" style="font-size:16px;padding:12px 26px">' +

        '<button class="btn" id="fReset">↺ Reset</button>' +
        '<button class="btn" id="fNoise">🌧 Ambience: off</button>' +
        '<button class="btn" id="fFull">⛶ Full screen</button>' +
      '</div>' +
      '<p style="color:var(--muted);margin-top:16px">Today: ' + todayLog.length +
        ' sessions · ' + minsToday + ' focus minutes</p>' +
    '</div>';

  document.getElementById('fmWork').addEventListener('click', () => switchMode('work'));
  document.getElementById('fmBreak').addEventListener('click', () => switchMode('break'));
  document.getElementById('fToggle').addEventListener('click', toggleRun);
  document.getElementById('fReset').addEventListener('click', () => { stopTimer(); fLeft = (fMode === 'work' ? fWorkMin : fBreakMin) * 60; render(); });
  document.getElementById('fTask').addEventListener('change', e => { fTaskId = e.target.value; });
  document.getElementById('fNoise').addEventListener('click', toggleNoise);
  document.getElementById('fFull').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });

function switchMode(mode) {
  stopTimer();
  fMode = mode;
  fLeft = (mode === 'work' ? fWorkMin : fBreakMin) * 60;
  render();
}

function stopTimer() {
  fRunning = false;
  if (fTimer) { clearInterval(fTimer); fTimer = null; }
  document.title = 'TYM · Track Your Mind';
}

function toggleRun() {
  if (fRunning) { stopTimer(); render(); return; }
  fRunning = true;
  document.getElementById('fToggle').textContent = '⏸ Pause';
  fTimer = setInterval(() => {
    fLeft -= 1;
    const clock = document.getElementById('fClock');
    if (clock) clock.textContent = fmt(fLeft);
    document.title = fmt(fLeft) + ' · TYM Focus';
    if (fLeft <= 0) roundDone();
  }, 1000);

/* A round finished: log work sessions, buzz, switch mode. */
function roundDone() {
  stopTimer();
  tymBuzz([200, 80, 200, 80, 400]);
  if (fMode === 'work') {
    state.focusLog.push({ date: todayStr(), minutes: fWorkMin, taskId: fTaskId || null });
    saveState(state);
    showToast('Session done 🎉 Logged ' + fWorkMin + ' focus minutes');
    fMode = 'break'; fLeft = fBreakMin * 60;
  } else {
    showToast('Break over — back to it 💪');
    fMode = 'work'; fLeft = fWorkMin * 60;
  }
  render();
}

/* Rain-like ambience: filtered noise, generated live.
   No audio file is shipped with the app. */
function toggleNoise(e) {
  if (noiseNodes) {
    noiseNodes.src.stop(); noiseNodes = null;
    e.target.textContent = '🌧 Ambience: off';
    return;
  }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { // brown-ish noise = soft rain
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const gain = ctx.createGain(); gain.gain.value = 0.16;
    src.connect(gain); gain.connect(ctx.destination);
    src.start();
    noiseNodes = { src, ctx };
    e.target.textContent = '🌧 Ambience: on';
  } catch (err) { showToast('Ambience is not available here'); }
}

    done.map(t => taskCardHTML(state, t, { compact: true })).join('') + '</div>';

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    const removedAll = state.tasks.filter(t => t.status === 'done');
    state.tasks = state.tasks.filter(t => t.status !== 'done');
    saveState(state);
    render();
    showToast('Cleared ' + removedAll.length + ' completed tasks', 'Undo', () => {
      removedAll.forEach(t => restoreTask(state, t));
      saveState(state);
      render();
    });
  });
}

__tymRegister('completed', render);


__tymRegister('completed', render);

})();
</script>
<script>
/* ===== screen: settings ===== */
(function(){
'use strict';
/* ============================================================
   TYM — Track Your Mind · settings.js
   What this file does: the SETTINGS screen.
   - Theme (light/dark)
   - Lists manager: add, rename, recolour, delete
     (deleting a list moves its tasks to Personal)
   - Notifications: ask the browser/app for permission
   - Backup: export the whole state as a JSON file,
     import it back
   - CSV import: bring tasks in from Todoist / TickTick
     exports (title + date columns are picked up)
   - Danger zone: erase everything
   ============================================================ */

function render() {
  const box = document.getElementById('screenContent');

  const listRows = state.lists.map(l => {
    const count = state.tasks.filter(t => t.listId === l.id).length;
    return '<div class="task"><span class="dot" style="background:' + l.color + ';width:14px;height:14px"></span>' +
      '<div class="task-main"><div class="task-title">' + escapeHTML(l.name) + '</div>' +
      '<div style="color:var(--muted);font-size:12.5px">' + count + ' tasks</div></div>' +
      '<input type="color" value="' + l.color + '" data-list-color="' + l.id + '" title="Colour">' +
      '<button class="icon-btn" data-list-rename="' + l.id + '">✏️</button>' +
      '<button class="icon-btn" data-list-del="' + l.id + '">🗑</button></div>';
  }).join('');

  box.innerHTML =
    '<div class="card" style="margin-bottom:12px"><h2>🎨 Appearance</h2>' +
      '<p style="color:var(--muted)">Current theme: <b>' + state.settings.theme + '</b></p>' +
      '<button class="btn" data-theme-toggle>🌙 Toggle dark / light</button></div>' +

    '<div class="card" style="margin-bottom:12px"><h2>🔔 Notifications</h2>' +
      '<p style="color:var(--muted)">Browser reminders need permission. In the Android app, alarms ring even when TYM is closed.</p>' +
      '<button class="btn" id="notifyBtn">Enable notifications</button>' +
      '<span class="pill" id="notifyState" style="margin-left:8px"></span></div>' +

    '<div class="card" style="margin-bottom:12px"><h2>🗂 My lists</h2>' + listRows +
      '<div class="toolbar" style="margin:10px 0 0"><input class="field" id="listInput" type="text" placeholder="New list name">' +
      '<button class="btn btn-primary" id="listAdd">Add list</button></div></div>' +

    '<div class="card" style="margin-bottom:12px"><h2>💾 Backup</h2>' +
      '<p style="color:var(--muted)">Your data lives only on this device. Export a backup file regularly.</p>' +
      '<button class="btn" id="exportBtn">⬇ Export backup (JSON)</button> ' +
      '<label class="btn" style="display:inline-block">⬆ Import backup <input type="file" id="importFile" accept=".json" hidden></label></div>' +

    '<div class="card" style="margin-bottom:12px"><h2>📥 Import tasks from CSV</h2>' +
      '<p style="color:var(--muted)">Works with Todoist and TickTick exports — the title and due-date columns are picked up; other columns are ignored.</p>' +
      '<label class="btn" style="display:inline-block">Choose CSV file <input type="file" id="csvFile" accept=".csv" hidden></label>' +
      '<span class="pill" id="csvResult" style="margin-left:8px"></span></div>' +

    '<div class="card" style="margin-bottom:12px"><h2>⌨️ Shortcuts</h2>' +
      '<p style="color:var(--muted);line-height:1.9">Ctrl+K — command palette<br>' +
      'n — new task · t — theme · 1–9 — jump to a screen · Esc — close popups</p></div>' +

    '<div class="card"><h2>⚠️ Danger zone</h2>' +
      '<p style="color:var(--muted)">Erase every task, habit and setting on this device. Export a backup first if unsure.</p>' +
      '<button class="btn" id="eraseBtn" style="border-color:var(--high);color:var(--high)">Erase everything</button></div>';

  updateNotifyState();
  document.getElementById('notifyBtn').addEventListener('click', enableNotifications);
  document.getElementById('listAdd').addEventListener('click', () => {
    const v = document.getElementById('listInput').value.trim();
    if (!v) return;
    state.lists.push({ id: makeId(), name: v, color: '#6d5cff' });
    saveState(state);
    render();
  });
  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importFile').addEventListener('change', importBackup);
  document.getElementById('csvFile').addEventListener('change', importCSV);
  document.getElementById('eraseBtn').addEventListener('click', () => {
    if (!confirm('Erase EVERYTHING in TYM on this device? This cannot be undone.')) return;
    localStorage.removeItem(TYM_STORAGE_KEY);
    state = createDefaultState();
    saveState(state);
    render();
    showToast('Fresh start — everything erased');
  });
}

function updateNotifyState() {
  const el = document.getElementById('notifyState');
  if (!el) return;
  if (tymInApp()) el.textContent = 'app mode — phone notifications';
  else if (!window.Notification) el.textContent = 'not supported in this browser';
  else el.textContent = 'permission: ' + Notification.permission;
}

async function enableNotifications() {
  if (tymInApp()) { await tymRequestNotifyPermission(); }
  else if (window.Notification) { await Notification.requestPermission(); }
  updateNotifyState();
  showToast('Notifications setting updated 🔔');
}

/* Download the whole state as tym-backup.json. */
function exportBackup() {
  const blob = new Blob([stateToBackupText(state)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tym-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* Load a backup file back in (parseState guards bad files). */
function importBackup(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    state = parseState(String(r.result));
    saveState(state);
    applyTheme();
    render();
    showToast('Backup imported 💾');
  };
  r.readAsText(file);
}

/* A tiny CSV reader: handles quoted commas.
   Finds a title column (TASK/content/title/name) and a
   date column (DATE/due/scheduled) if they exist. */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function importCSV(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const rows = parseCSV(String(r.result));
    if (!rows.length) return;
    const head = rows[0].map(h => h.trim().toLowerCase());
    const ti = head.findIndex(h => ['task', 'content', 'title', 'name'].includes(h));
    const di = head.findIndex(h => ['date', 'due', 'due date', 'scheduled'].includes(h));
    let added = 0;
    for (const row of rows.slice(1)) {
      const title = (ti >= 0 ? row[ti] : row[0] || '').trim();
      if (!title) continue;
      let due = null;
      if (di >= 0 && /^\d{4}-\d{2}-\d{2}/.test((row[di] || '').trim())) due = row[di].trim().slice(0, 10);
      addTaskToState(state, { title, due, listId: 'personal' });
      added++;
    }
    saveState(state);
    document.getElementById('csvResult').textContent = added + ' tasks imported';
    showToast('Imported ' + added + ' tasks 📥');
  };
  r.readAsText(file);
}

/* List manager clicks (delegated). */
document.addEventListener('click', e => {
  const ren = e.target.closest('[data-list-rename]');
  if (ren) {
    const l = state.lists.find(x => x.id === ren.dataset.listRename);
    const name = prompt('Rename list', l ? l.name : '');
    if (l && name && name.trim()) { l.name = name.trim(); saveState(state); render(); }
    return;
  }
  const del = e.target.closest('[data-list-del]');
  if (del) {
    const id = del.dataset.listDel;
    if (state.lists.length <= 1) { showToast('Keep at least one list'); return; }
    const fallback = state.lists.find(x => x.id !== id);
    state.tasks.forEach(t => { if (t.listId === id) t.listId = fallback.id; });
    state.lists = state.lists.filter(x => x.id !== id);
    saveState(state);
    render();
    showToast('List deleted — its tasks moved to ' + fallback.name);
  }
});
document.addEventListener('change', e => {
  const col = e.target.closest('[data-list-color]');
  if (col) {
    const l = state.lists.find(x => x.id === col.dataset.listColor);
    if (l) { l.color = col.value; saveState(state); }
  }
});

__tymRegister('settings', render);

__tymRegister('settings', render);

})();
</script>

<script>
/* ===== TYM single-file router (navigation) ===== */
const TYM_META = {
  today:    ['\u2600\uFE0F Today', ''],
  all:      ['\uD83D\uDDC2\uFE0F All Tasks', 'Search, filter and reorder everything you have open.'],
  calendar: ['\uD83D\uDCC5 Calendar', 'Month view of your tasks — drag a task onto a day to move it.'],
  board:    ['\uD83D\uDCCB Board', 'Kanban columns — drag tasks from To do to Done.'],
  matrix:   ['\uD83C\uDFAF Matrix', 'Urgent x Important — the Eisenhower view.'],
  timeline: ['\uD83D\uDD50 Timeline', 'Your day, hour by hour — with Plan My Day.'],
  habits:   ['\uD83D\uDD25 Habits', 'Daily habits, streaks and morning routines.'],
  focus:    ['\uD83C\uDF45 Focus', 'Pomodoro timer tied to your current task.'],
  review:   ['\uD83D\uDCCA Review', 'Week graph, year heatmap and focus minutes.'],
  study:    ['\uD83D\uDCDA Study', 'Subjects and chapters, with progress per subject.'],
  exams:    ['\u23F3 Exams', 'Countdowns and one-tap revision plans.'],
  timetable:['\uD83C\uDFEB Timetable', 'Your weekly class schedule.'],
  completed:['\u2705 Completed', 'Everything you have finished. Well done.'],
  settings: ['\u2699\uFE0F Settings', 'Theme, lists, notifications, backup and imports.']
};
function tymActivate(id) {
  if (!TYM_META[id]) id = 'today';
  window.__tymActive = id;
  document.body.dataset.screen = id;
  buildSidebar(); buildBottomBar();
  document.getElementById('screenTitle').textContent = TYM_META[id][0];
  if (id !== 'today') document.getElementById('greetingLine').textContent = TYM_META[id][1];
  document.getElementById('quickBar').style.display = id === 'today' ? '' : 'none';
  document.getElementById('allToolbar').style.display = id === 'all' ? '' : 'none';
  if (window.__tymInits[id] && !window.__tymInited[id]) {
    window.__tymInited[id] = true; window.__tymInits[id]();
  } else if (window.__tymRenders[id]) {
    window.__tymRenders[id]();
  }
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) {
    e.preventDefault(); e.stopPropagation();
    const s = TYM_SCREENS.find(x => x.file === go.dataset.goto);
    if (s) tymActivate(s.id);
    return;
  }
  const a = e.target.closest('#bottomBar a');
  if (a) {
    e.preventDefault();
    const s = TYM_SCREENS.find(x => a.getAttribute('href') === x.file);
    if (s) tymActivate(s.id);
  }
}, true);
document.addEventListener('tym:changed', () => {
  const r = window.__tymRenders[window.__tymActive];
  if (r) r();
});
document.addEventListener('DOMContentLoaded', () => tymActivate('today'));
</script>
