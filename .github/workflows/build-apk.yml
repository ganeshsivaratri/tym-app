name: Build TYM APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the source
        run: unzip -o tym-source.zip -d src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install app packages
        working-directory: src/android-app
        run: npm install
      - name: Sync the app into Android
        working-directory: src/android-app
        run: npx cap sync android
      - name: Build the APK
        working-directory: src/android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Save the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: tym-apk
          path: src/android-app/android/app/build/outputs/apk/debug/app-debug.apk
